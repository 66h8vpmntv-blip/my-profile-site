<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>学習記録</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- ==============================
       WORD / STUDY タブ
       ============================== -->

  <nav class="study-tabs">

    <a
      href="word.html"
      class="study-tab"
    >
      📖 WORD
    </a>

    <a
      href="study.html"
      class="study-tab active"
    >
      📊 STUDY
    </a>

  </nav>


  <header>

    <h1>📊 学習記録</h1>

    <p>
      単語の定着度を確認しよう！
    </p>

  </header>


  <main class="study-container">


    <!-- ==============================
         全体の記録
         ============================== -->

    <section class="study-summary">


      <div class="study-card">

        <h2>📚 学習単語</h2>

        <p>

          <span id="learnedWords">
            0
          </span>

          /

          <span id="totalWords">
            0
          </span>

        </p>

      </div>


      <div class="study-card">

        <h2>⭐ 習得済み</h2>

        <p>

          <span id="masteredWords">
            0
          </span>

        </p>

      </div>


      <div class="study-card">

        <h2>📖 学習中</h2>

        <p>

          <span id="learningWords">
            0
          </span>

        </p>

      </div>


      <div class="study-card">

        <h2>🔥 要復習</h2>

        <p>

          <span id="weakWords">
            0
          </span>

        </p>

      </div>


    </section>


    <!-- ==============================
         定着度の説明
         ============================== -->

    <section class="mastery-guide">

      <h2>🧠 定着度</h2>

      <p>🌱 ★☆☆☆☆　覚え始め</p>

      <p>📖 ★★☆☆☆　学習中</p>

      <p>👍 ★★★☆☆　だいぶ定着</p>

      <p>💪 ★★★★☆　かなり定着</p>

      <p>⭐ ★★★★★　習得</p>

    </section>


    <!-- ==============================
         苦手単語
         ============================== -->

    <section class="weak-section">

      <h2>
        🔥 要復習の単語
      </h2>

      <div id="weakList"></div>


      <button
        id="weakQuizButton"
        onclick="startWeakQuiz()"
      >
        🔥 苦手単語を復習する
      </button>

    </section>


    <!-- ==============================
         全単語
         ============================== -->

    <section class="all-section">

      <h2>
        📖 単語の定着状況
      </h2>

      <div id="wordList"></div>

    </section>


    <!-- ==============================
         戻る
         ============================== -->

    <a
      href="study-home.html"
      class="home-button"
    >
      📚 学習HOME
    </a>


    <a
      href="index.html"
      class="home-button"
    >
      🏠 元のHOME
    </a>


  </main>


  <!-- ==============================
       学習データ読み込み
       ============================== -->

  <script src="script.js"></script>


  <script>

    // ==============================
    // 単語データ
    // ==============================

    const studyWords = [
      { word: "apple", meaning: "りんご" },
      { word: "book", meaning: "本" },
      { word: "school", meaning: "学校" },
      { word: "teacher", meaning: "先生" },
      { word: "friend", meaning: "友達" },
      { word: "house", meaning: "家" },
      { word: "water", meaning: "水" },
      { word: "food", meaning: "食べ物" },
      { word: "dog", meaning: "犬" },
      { word: "cat", meaning: "猫" },
      { word: "car", meaning: "車" },
      { word: "sun", meaning: "太陽" },
      { word: "moon", meaning: "月" },
      { word: "morning", meaning: "朝" },
      { word: "night", meaning: "夜" },
      { word: "happy", meaning: "幸せな" },
      { word: "big", meaning: "大きい" },
      { word: "small", meaning: "小さい" },
      { word: "beautiful", meaning: "美しい" },
      { word: "important", meaning: "重要な" }
    ];


    // ==============================
    // 保存されたデータ
    // ==============================

    const savedData =
      JSON.parse(
        localStorage.getItem(
          "wordStudyData"
        )
      ) || {};


    // ==============================
    // 定着度
    // ==============================

    function masteryStars(streak) {

      const level =
        Math.min(
          streak,
          5
        );

      return (
        "★".repeat(level) +
        "☆".repeat(5 - level)
      );

    }


    function masteryText(streak) {

      if (streak >= 5) {
        return "⭐ 習得";
      }

      if (streak === 4) {
        return "💪 かなり定着";
      }

      if (streak === 3) {
        return "👍 だいぶ定着";
      }

      if (streak === 2) {
        return "📖 学習中";
      }

      if (streak === 1) {
        return "🌱 覚え始め";
      }

      return "🔥 要復習";

    }


    // ==============================
    // 集計
    // ==============================

    let learned = 0;

    let mastered = 0;

    let learning = 0;

    let weak = 0;


    studyWords.forEach(item => {

      const data =
        savedData[item.word] || {
          correct: 0,
          wrong: 0,
          streak: 0
        };


      // 学習済み

      if (
        data.correct > 0 ||
        data.wrong > 0
      ) {

        learned++;

      }


      // 習得

      if (
        data.streak >= 5
      ) {

        mastered++;

      }


      // 苦手

      else if (
        data.wrong >= 2 &&
        data.wrong > data.correct
      ) {

        weak++;

      }


      // 学習中

      else if (
        data.correct > 0 ||
        data.wrong > 0
      ) {

        learning++;

      }

    });


    // ==============================
    // 数字表示
    // ==============================

    document.getElementById(
      "learnedWords"
    ).textContent =
      learned;


    document.getElementById(
      "totalWords"
    ).textContent =
      studyWords.length;


    document.getElementById(
      "masteredWords"
    ).textContent =
      mastered;


    document.getElementById(
      "learningWords"
    ).textContent =
      learning;


    document.getElementById(
      "weakWords"
    ).textContent =
      weak;


    // ==============================
    // 苦手単語ランキング
    // ==============================

    const weakList =
      document.getElementById(
        "weakList"
      );


    const weakWords =
      studyWords
        .filter(item => {

          const data =
            savedData[item.word];

          return (
            data &&
            data.wrong >= 2 &&
            data.wrong > data.correct
          );

        })
        .sort((a, b) => {

          const A =
            savedData[a.word];

          const B =
            savedData[b.word];


          return (
            B.wrong -
            A.wrong
          );

        });


    if (
      weakWords.length === 0
    ) {

      weakList.innerHTML =
        `
        <p>
          🎉 今のところ要復習の単語はありません！
        </p>
        `;

    }

    else {

      weakWords.forEach(
        (item, index) => {

          const data =
            savedData[item.word];


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "weak-word";


          div.innerHTML = `

            <strong>
              ${index + 1}.
              ${item.word}
            </strong>

            <span>
              ${item.meaning}
            </span>

            <span>
              ${masteryStars(data.streak)}
            </span>

            <span>
              ${masteryText(data.streak)}
            </span>

            <small>
              ⭕ ${data.correct}回
             　❌ ${data.wrong}回
             　連続正解 ${data.streak}回
            </small>

          `;


          weakList.appendChild(
            div
          );

        }
      );

    }


    // ==============================
    // 全単語
    // ==============================

    const wordList =
      document.getElementById(
        "wordList"
      );


    studyWords.forEach(item => {

      const data =
        savedData[item.word] || {
          correct: 0,
          wrong: 0,
          streak: 0
        };


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "word-record";


      div.innerHTML = `

        <strong>
          ${item.word}
        </strong>

        <span>
          ${item.meaning}
        </span>

        <span>
          ${masteryStars(data.streak)}
        </span>

        <span>
          ${masteryText(data.streak)}
        </span>

        <small>
          ⭕ 正解 ${data.correct}回
          /
          ❌ 不正解 ${data.wrong}回
          /
          🔥 連続 ${data.streak}回
        </small>

      `;


      wordList.appendChild(
        div
      );

    });


    // ==============================
    // 苦手単語復習
    // ==============================

    function startWeakQuiz() {

      if (
        weakWords.length === 0
      ) {

        alert(
          "現在、要復習の単語はありません！"
        );

        return;

      }


      window.location.href =
        "word.html?mode=weak";

    }

  </script>


</body>

</html>
