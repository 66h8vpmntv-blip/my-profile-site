<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

>

<title>2D Action Game</title>

<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
  touch-action: none;
}

body {

  margin: 0;

  background: #111;

  overflow: hidden;

  font-family: sans-serif;

}


/* =========================
   ゲーム画面
========================= */

#game {

  display: block;

  width: 100vw;

  height: 70vh;

}


/* =========================
   情報
========================= */

#info {

  position: absolute;

  top: 10px;

  left: 10px;

  color: white;

  font-size: 18px;

  font-weight: bold;

  z-index: 10;

  text-shadow:
    2px 2px 3px #000;

}


/* =========================
   操作ボタン
========================= */

#controls {

  height: 30vh;

  background: #222;

  display: flex;

  justify-content: space-around;

  align-items: center;

}


#controls button {

  width: 100px;

  height: 100px;

  border: none;

  border-radius: 50%;

  background: #555;

  color: white;

  font-size: 40px;

}


#jump {

  background: #e03131;

}


/* =========================
   キャラクター選択画面
========================= */

#characterScreen {

  position: fixed;

  top: 0;

  left: 0;

  width: 100vw;

  height: 70vh;

  background:
    linear-gradient(
      #228be6,
      #74c0fc
    );

  z-index: 100;

  text-align: center;

  padding-top: 25px;

  color: white;

  overflow-y: auto;

}


#characterScreen h1 {

  font-size: 30px;

  margin: 10px 0 25px;

  text-shadow:
    3px 3px 4px #333;

}


.characters {

  display: flex;

  justify-content: center;

  gap: 15px;

  flex-wrap: wrap;

}


.character {

  width: 105px;

  height: 130px;

  border: 4px solid white;

  border-radius: 15px;

  background:
    rgba(0,0,0,0.25);

  color: white;

  font-size: 55px;

  cursor: pointer;

  transition: 0.15s;

}


.character span {

  display: block;

  font-size: 13px;

  margin-top: 8px;

}


.character.selected {

  border:
    5px solid #ffd43b;

  transform:
    scale(1.08);

  background:
    rgba(255,212,59,0.25);

}


#selectedCharacter {

  font-size: 18px;

  margin: 20px 0;

}


/* =========================
   スタートボタン
========================= */

#startButton {

  width: 220px;

  height: 60px;

  border-radius: 15px;

  background: #37b24d;

  color: white;

  font-size: 22px;

  font-weight: bold;

  border: 3px solid white;

  display: block;

  margin: 0 auto;

}


/* =========================
   SITEへ戻る
========================= */

#siteButton {

  width: 220px;

  height: 60px;

  border-radius: 15px;

  background: #495057;

  color: white;

  border: 3px solid white;

  font-size: 20px;

  font-weight: bold;

  margin-top: 15px;

}


/* =========================
   GAME OVER画面
========================= */

#gameOverScreen {

  display: none;

  position: fixed;

  top: 0;

  left: 0;

  width: 100vw;

  height: 70vh;

  background:
    rgba(0,0,0,0.85);

  z-index: 200;

  color: white;

  text-align: center;

  padding-top: 65px;

}


#gameOverScreen h1 {

  color: #ff6b6b;

  font-size: 48px;

  margin-bottom: 15px;

}


#gameOverScreen p {

  font-size: 21px;

}


#retryButton {

  width: 230px;

  height: 65px;

  border-radius: 15px;

  background: #e03131;

  color: white;

  border: 3px solid white;

  font-size: 22px;

  font-weight: bold;

  margin-top: 15px;

}


#gameOverTitleButton {

  height: 65px;

  border-radius: 15px;

  background: #228be6;

  color: white;

  border: 3px solid white;

  font-size: 22px;

  font-weight: bold;

  margin-top: 12px;

}


/* =========================
   CLEAR画面
========================= */

#clearScreen {

  display: none;

  position: fixed;

  top: 0;

  left: 0;

  width: 100vw;

  height: 70vh;

  text-align: center;

  padding-top: 70px;

}


#clearScreen h1 {

  font-size: 48px;

}


#clearScreen p {

}


#titleButton {

  border-radius: 15px;

  background: #228be6;

  color: white;

  border: 3px solid white;

  font-size: 22px;

  font-weight: bold;

}


/* =========================

========================= */

@media (max-width: 600px) {

  }

  }

const goal = {

// =========================
// 画面サイズ
// =========================

function resize() {

  canvas.width =
    window.innerWidth;


  canvas.height =
    window.innerHeight * 0.7;


  goal.y =
    canvas.height -
    50 -
    goal.height;

}


resize();


window.addEventListener(
  "resize",
  resize
);


// =========================
// 当たり判定
// =========================

function collision(a, b) {

  return (

    a.x <
      b.x + b.width &&

    a.x + a.width >
      b.x &&

    a.y <
      b.y + b.height &&

    a.y + a.height >
      b.y

  );

}


// =========================
// キャラクター選択
// =========================

function selectCharacter(
  number
) {

  selectedCharacter =
    number;


  const buttons =
    document.querySelectorAll(
      ".character"
    );


  buttons.forEach(
    button => {

      button.classList.remove(
        "selected"
      );

    }
  );


  buttons[
    number - 1
  ].classList.add(
    "selected"
  );


  document.getElementById(
    "selectedCharacter"
  ).textContent =

    "CHARACTER " +
    number +
    " を選択中";

}


// =========================
// ゲーム開始
// =========================

function startGame() {

  gameStarted = true;

  stage = 1;

  hp = 3;

  finalClear = false;

  gameOver = false;


  document.getElementById(
    "characterScreen"
  ).style.display =
    "none";


  document.getElementById(
    "gameOverScreen"
  ).style.display =
    "none";


  document.getElementById(
    "clearScreen"
  ).style.display =
    "none";


  loadStage();

}


// =========================
// RETRY
// =========================

function retryGame() {

  gameOver = false;

  stageClear = false;

  finalClear = false;

  hp = 3;


  document.getElementById(
    "gameOverScreen"
  ).style.display =
    "none";


  loadStage();

}


// =========================
// TITLEへ戻る
// =========================

function backToTitle() {

  gameStarted = false;

  stage = 1;

  hp = 3;

  coinCount = 0;

  gameOver = false;

  stageClear = false;

  finalClear = false;


  document.getElementById(
    "gameOverScreen"
  ).style.display =
    "none";


  document.getElementById(
    "clearScreen"
  ).style.display =
    "none";


  document.getElementById(
    "characterScreen"
  ).style.display =
    "block";


  document.getElementById(
    "info"
  ).textContent = "";

}


// =========================
// SITEへ戻る
// =========================

function backToSite() {

  window.location.href =
    "https://66h8vpmntv-blip.github.io/my-profile-site/index.html";

}

// =========================

      ),

      createEnemy(
        1250,
        2,

      ),

      createEnemy(

        2.5
      )

    ].filter(Boolean);

  }

  else {

    enemies = [

      createEnemy(
        550,
        1,
        2.5
      ),

      createEnemy(
        1000,
        2,
        -2.5
      ),

      createEnemy(
        1450,
        3,
        3
      ),

      createEnemy(
        2000,
        4,
        -3
      )

    ].filter(Boolean);

  }


  // =========================
  // コイン

// コインを配置

const groundCoins =
  stage === 1
  ? stage1GroundCoins
  : stage2GroundCoins;

const jumpCoins =
  stage === 1
  ? stage1JumpCoins
  : stage2JumpCoins;


// 地面コイン
coins = groundCoins.map(
  c => ({

    x: c.x,

    y: 25,

    size: 22,

    taken: false

  })
);


// ジャンプコイン
coins.push(

    c => ({

      c => ({

        x:
          c.x,

        y:
          c.y,

        size:
          22,

        taken:

      })
    );

}


// =========================
// ジャンプ
// =========================

function jump() {

  if (

    gameStarted &&

    player.grounded &&

    !gameOver &&

    !stageClear &&

    !finalClear

  ) {

    player.vy =
      -player.jumpPower;

    player.grounded =
      false;

  }

}


// =========================
// ボタン
// =========================

function setupButton(
  id,
  key
) {

  const button =
    document.getElementById(id);


  button.addEventListener(
    "touchstart",
    e => {

      e.preventDefault();

      keys[key] = true;

    }
  );


  button.addEventListener(
    "touchend",
    e => {

      e.preventDefault();

      keys[key] = false;

    }
  );


  button.addEventListener(
    "mousedown",
    e => {

      e.preventDefault();

      keys[key] = true;

    }
  );


  button.addEventListener(
    "mouseup",
    e => {

      e.preventDefault();

      keys[key] = false;

    }
  );

}


setupButton(
  "left",
  "left"
);


setupButton(
  "right",
  "right"
);


document
  .getElementById("jump")
  .addEventListener(
    "touchstart",
    e => {

      e.preventDefault();

      jump();

    }
  );


document
  .getElementById("jump")
  .addEventListener(
    "mousedown",
    e => {

      e.preventDefault();

      jump();

    }
  );


// =========================
// キーボード
// =========================

window.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "ArrowLeft"
    ) {

      keys.left = true;

    }


    if (
      e.key === "ArrowRight"
    ) {

      keys.right = true;

    }


    if (

      e.key === "ArrowUp" ||

      e.key === " "

    ) {

      jump();

    }

  }
);


window.addEventListener(
  "keyup",
  e => {

    if (
      e.key === "ArrowLeft"
    ) {

      keys.left = false;

    }


    if (
      e.key === "ArrowRight"
    ) {

      keys.right = false;

    }

  }
);


// =========================
// ステージクリア
// =========================

function clearStage() {

  stageClear = true;


  setTimeout(
    () => {

      if (
        stage === 1
      ) {

        stage = 2;

        loadStage();

      }

      else {

        finalClear = true;


        document.getElementById(
          "clearScreen"
        ).style.display =
          "block";

      }

    },
    1500
  );

}


// =========================
// 穴に落ちた
// =========================

function fallDown() {

  hp--;


  if (
    hp <= 0
  ) {

    showGameOver();

    return;

  }


  player.x = 150;

  player.y = 100;

  player.vx = 0;

  player.vy = 0;

  cameraX = 0;

}


// =========================
// 敵に当たった
// =========================

function damagePlayer() {

  hp--;


  if (
    hp <= 0
  ) {

    showGameOver();

    return;

  }


  player.x = 150;

  player.y = 100;

  player.vx = 0;

  player.vy = 0;

  cameraX = 0;

}


// =========================
// GAME OVER
// =========================

function showGameOver() {

  gameOver = true;


  document.getElementById(
    "gameOverScreen"
  ).style.display =
    "block";

}


// =========================
// 更新
// =========================

function update() {

  if (

    !gameStarted ||

    gameOver ||

    stageClear ||

    finalClear

  ) {

    return;

  }


  // =========================
  // プレイヤー移動
  // =========================

  if (keys.left) {

    player.vx =
      -player.speed;

  }

  else if (
    keys.right
  ) {

    player.vx =
      player.speed;

  }

  else {

    player.vx = 0;

  }


  player.x +=
    player.vx;


  const oldY =
    player.y;


  player.vy +=
    gravity;


  player.y +=
    player.vy;


  player.grounded =
    false;


  // =========================
  // 足場
  // =========================

  for (
    const platform of platforms
  ) {

    if (

      player.x +
        player.width >
        platform.x &&

      player.x <
        platform.x +
        platform.width &&

      oldY +
        player.height <=
        platform.y &&

      player.y +
        player.height >=
        platform.y &&

      player.vy >= 0

    ) {

      player.y =
        platform.y -
        player.height;

      player.vy = 0;

      player.grounded =
        true;

    }

  }


  // =========================
  // 穴
  // =========================

  if (
    player.y >
    canvas.height + 80
  ) {

    fallDown();

  }


  // =========================
  // 左右制限
  // =========================

  if (
    player.x < 0
  ) {

    player.x = 0;

  }


  if (
    player.x >
    STAGE_WIDTH -
    player.width
  ) {

    player.x =
      STAGE_WIDTH -
      player.width;

  }


  // =========================
  // カメラ
  // =========================

  const targetCamera =
    player.x -
    canvas.width * 0.4;


  cameraX +=
    (
      targetCamera -
      cameraX
    ) * 0.1;


  if (
    cameraX < 0
  ) {

    cameraX = 0;

  }


  if (
    cameraX >
    STAGE_WIDTH -
    canvas.width
  ) {

    cameraX =
      STAGE_WIDTH -
      canvas.width;

  }


  // =========================
  // 敵
  // =========================

  for (
    const enemy of enemies
  ) {

    enemy.x +=
      enemy.vx;


    // 足場の端で反転

    if (
      enemy.x <= enemy.minX
    ) {

      enemy.x =
        enemy.minX;

      enemy.vx =
        Math.abs(
          enemy.vx
        );

    }


    if (
      enemy.x >= enemy.maxX
    ) {

      enemy.x =
        enemy.maxX;

      enemy.vx =
        -Math.abs(
          enemy.vx
        );

    }


    // 地面に固定

    const platform =
      platforms[
        enemy.platformIndex
      ];


    if (platform) {

      enemy.y =
        platform.y -
        enemy.height;

    }


    // プレイヤーとの衝突

    if (
      collision(
        player,
        enemy
      )
    ) {

      damagePlayer();

    }

  }


  // =========================
  // コイン
  // =========================

  for (
    const coin of coins
  ) {

    if (
      !coin.taken
    ) {

      const coinBox = {

        x:
          coin.x,

        y:
          canvas.height -
          50 -
          coin.y,

        width:
          coin.size,

        height:
          coin.size

      };


      if (
        collision(
          player,
          coinBox
        )
      ) {

        coin.taken =
          true;

        coinCount++;

      }

    }

  }


  // =========================
  // ゴール
  // =========================

  const goalBox = {

    x:
      goal.x,

    y:
      goal.y,

    width:
      goal.width,

    height:
      goal.height

  };


  if (
    collision(
      player,
      goalBox
    )
  ) {

    clearStage();

  }

}


// =========================
// プレイヤー描画
// =========================

function drawPlayer() {

  if (
    selectedCharacter === 1
  ) {

    ctx.fillStyle =
      "#ff6b6b";

    ctx.fillRect(
      player.x,
      player.y,
      player.width,
      player.height
    );


    ctx.fillStyle =
      "#ffd8a8";

    ctx.fillRect(
      player.x + 7,
      player.y + 5,
      26,
      22
    );


    ctx.fillStyle =
      "#343a40";

    ctx.fillRect(
      player.x + 5,
      player.y + 3,
      30,
      8
    );

  }

  else if (
    selectedCharacter === 2
  ) {

    ctx.fillStyle =
      "#7950f2";

    ctx.fillRect(
      player.x,
      player.y + 10,
      player.width,
      30
    );


    ctx.fillStyle =
      "#ffd8a8";

    ctx.fillRect(
      player.x + 7,
      player.y,
      26,
      22
    );


    ctx.fillStyle =
      "#5f3dc4";

    ctx.beginPath();

    ctx.moveTo(
      player.x + 20,
      player.y - 12
    );

    ctx.lineTo(
      player.x + 3,
      player.y + 8
    );

    ctx.lineTo(
      player.x + 37,
      player.y + 8
    );

    ctx.closePath();

    ctx.fill();

  }

  else {

    ctx.fillStyle =
      "#868e96";

    ctx.fillRect(
      player.x,
      player.y,
      player.width,
      player.height
    );


    ctx.fillStyle =
      "#74c0fc";

    ctx.fillRect(
      player.x + 7,
      player.y + 10,
      8,
      8
    );

    ctx.fillRect(
      player.x + 25,
      player.y + 10,
      8,
      8
    );


    ctx.fillStyle =
      "#228be6";

    ctx.fillRect(
      player.x + 12,
      player.y + 27,
      16,
      7
    );

  }

}


// =========================
// 描画
// =========================

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // 空

  ctx.fillStyle =
    stage === 1
    ? "#74c0fc"
    : "#b197fc";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();


  ctx.translate(
    -cameraX,
    0
  );


  // =========================
  // 足場
  // =========================

  for (
    const platform of platforms
  ) {

    ctx.fillStyle =
      "#40c057";


    ctx.fillRect(
      platform.x,
      platform.y,
      platform.width,
      platform.height
    );


    ctx.fillStyle =
      "#8d5524";


    ctx.fillRect(
      platform.x,
      platform.y + 15,
      platform.width,
      platform.height - 15
    );

  }


  // =========================
  // コイン
  // =========================

  for (
    const coin of coins
  ) {

    if (
      !coin.taken
    ) {

      const coinY =
        canvas.height -
        50 -
        coin.y;


      ctx.beginPath();


      ctx.arc(

        coin.x +
          coin.size / 2,

        coinY +
          coin.size / 2,

        coin.size / 2,

        0,

        Math.PI * 2

      );


      ctx.fillStyle =
        "#ffd43b";

      ctx.fill();


      ctx.strokeStyle =
        "#f08c00";

      ctx.lineWidth = 3;

      ctx.stroke();

    }

  }


  // =========================
  // ゴール
  // =========================

  ctx.fillStyle =
    "#7950f2";


  ctx.fillRect(
    goal.x,
    goal.y,
    8,
    goal.height
  );


  ctx.fillStyle =
    "#ff6b6b";


  ctx.beginPath();


  ctx.moveTo(
    goal.x + 8,
    goal.y
  );


  ctx.lineTo(
    goal.x + 40,
    goal.y + 20
  );


  ctx.lineTo(
    goal.x + 8,
    goal.y + 40
  );


  ctx.closePath();


  ctx.fill();


  // =========================
  // 敵
  // =========================

  for (
    const enemy of enemies
  ) {

    ctx.fillStyle =
      stage === 1
      ? "#7048e8"
      : "#c92a2a";


    ctx.fillRect(
      enemy.x,
      enemy.y,
      enemy.width,
      enemy.height
    );


    ctx.fillStyle =
      "white";


    ctx.fillRect(
      enemy.x + 8,
      enemy.y + 10,
      8,
      8
    );


    ctx.fillRect(
      enemy.x + 29,
      enemy.y + 10,
      8,
      8
    );

  }


  // =========================
  // プレイヤー
  // =========================

  drawPlayer();


  ctx.restore();


  // =========================
  // 情報
  // =========================

  document.getElementById(
    "info"
  ).textContent =

    "STAGE " +
    stage +

    "　❤️ HP: " +
    hp +

    "　🪙 COIN: " +
    coinCount +
    "/" +
    coins.length;


  // =========================
  // ステージクリア
  // =========================

  if (
    stageClear
  ) {

    ctx.fillStyle =
      "rgba(0,0,0,0.65)";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#ffd43b";


    ctx.textAlign =
      "center";


    ctx.font =
      "45px sans-serif";


    ctx.fillText(

      "STAGE " +
      stage +
      " CLEAR!",

      canvas.width / 2,

      canvas.height / 2

    );


    ctx.textAlign =
      "left";

  }

}


// =========================
// ゲームループ
// =========================

function gameLoop() {

  update();

  draw();

  requestAnimationFrame(
    gameLoop
  );

}


gameLoop();

</script>
