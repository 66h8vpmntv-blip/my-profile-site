<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>2D Action Game</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  background: #111;
  overflow: hidden;
  font-family: sans-serif;
}

#game {
  display: block;
  width: 100vw;
  height: 70vh;
  background: linear-gradient(#74c0fc, #d0ebff);
}

#info {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  z-index: 10;
}

#controls {
  height: 30vh;
  background: #222;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

button {
  width: 100px;
  height: 100px;
  border: none;
  border-radius: 50%;
  background: #555;
  color: white;
  font-size: 40px;
}

#jump {
  background: #e03131;
}
</style>
</head>

<body>

<div id="info"></div>

<canvas id="game"></canvas>

<div id="controls">
  <button id="left">←</button>
  <button id="jump">↑</button>
  <button id="right">→</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gravity = 0.6;

let stage = 1;
let hp = 3;
let coinCount = 0;
let gameOver = false;
let stageClear = false;
let finalClear = false;


// プレイヤー
const player = {
  x: 80,
  y: 100,
  width: 40,
  height: 40,
  vx: 0,
  vy: 0,
  speed: 5,
  jumpPower: 12,
  grounded: false
};


// 地面
const ground = {
  x: 0,
  y: 0,
  width: 0,
  height: 50
};


// 敵
const enemy = {
  x: 500,
  y: 100,
  width: 45,
  height: 45,
  vx: 2.5
};


// ゴール
const goal = {
  x: 0,
  y: 0,
  width: 35,
  height: 80
};


// コイン
let coins = [];


// ステージ1
const stage1Coins = [
  { x: 220, y: 250 },
  { x: 350, y: 180 },
  { x: 480, y: 250 },
  { x: 620, y: 170 },
  { x: 760, y: 250 }
];


// ステージ2
const stage2Coins = [
  { x: 180, y: 180 },
  { x: 320, y: 250 },
  { x: 450, y: 150 },
  { x: 590, y: 230 },
  { x: 730, y: 130 },
  { x: 850, y: 250 }
];


const keys = {
  left: false,
  right: false
};


// 画面サイズ
function resize() {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.7;

  ground.y = canvas.height - 50;
  ground.width = canvas.width;

  goal.x = canvas.width - 70;
  goal.y = ground.y - goal.height;
}

resize();

window.addEventListener("resize", resize);


// 当たり判定
function collision(a, b) {

  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );

}


// ステージを読み込む
function loadStage() {

  player.x = 80;
  player.y = 100;
  player.vx = 0;
  player.vy = 0;

  enemy.x = stage === 1 ? 500 : 450;

  enemy.vx = stage === 1 ? 2.5 : 4;

  coinCount = 0;

  stageClear = false;

  gameOver = false;

  if (stage === 1) {

    coins = stage1Coins.map(coin => ({
      x: coin.x,
      y: coin.y,
      size: 22,
      taken: false
    }));

  } else {

    coins = stage2Coins.map(coin => ({
      x: coin.x,
      y: coin.y,
      size: 22,
      taken: false
    }));

  }
}


// ジャンプ
function jump() {

  if (
    player.grounded &&
    !gameOver &&
    !stageClear &&
    !finalClear
  ) {

    player.vy = -player.jumpPower;

    player.grounded = false;
  }
}


// ボタン
function setupButton(id, key) {

  const button = document.getElementById(id);

  button.addEventListener("touchstart", e => {

    e.preventDefault();

    keys[key] = true;

  });

  button.addEventListener("touchend", e => {

    e.preventDefault();

    keys[key] = false;

  });

  button.addEventListener("mousedown", e => {

    e.preventDefault();

    keys[key] = true;

  });

  button.addEventListener("mouseup", e => {

    e.preventDefault();

    keys[key] = false;

  });
}

setupButton("left", "left");
setupButton("right", "right");


document.getElementById("jump").addEventListener("touchstart", e => {

  e.preventDefault();

  jump();

});


document.getElementById("jump").addEventListener("mousedown", e => {

  e.preventDefault();

  jump();

});


// キーボード
window.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft") {
    keys.left = true;
  }

  if (e.key === "ArrowRight") {
    keys.right = true;
  }

  if (e.key === "ArrowUp" || e.key === " ") {
    jump();
  }

});


window.addEventListener("keyup", e => {

  if (e.key === "ArrowLeft") {
    keys.left = false;
  }

  if (e.key === "ArrowRight") {
    keys.right = false;
  }

});


// ステージクリア
function clearStage() {

  stageClear = true;

  setTimeout(() => {

    if (stage === 1) {

      stage = 2;

      loadStage();

    } else {

      finalClear = true;

    }

  }, 1500);
}


// 更新
function update() {

  if (
    gameOver ||
    stageClear ||
    finalClear
  ) {
    return;
  }


  // 移動
  if (keys.left) {

    player.vx = -player.speed;

  } else if (keys.right) {

    player.vx = player.speed;

  } else {

    player.vx = 0;

  }


  player.x += player.vx;


  // 重力
  player.vy += gravity;

  player.y += player.vy;


  // 地面
  if (player.y + player.height >= ground.y) {

    player.y = ground.y - player.height;

    player.vy = 0;

    player.grounded = true;

  }


  // 画面端
  if (player.x < 0) {

    player.x = 0;

  }

  if (player.x + player.width > canvas.width) {

    player.x = canvas.width - player.width;

  }


  // 敵
  enemy.x += enemy.vx;


  if (
    enemy.x < 100 ||
    enemy.x + enemy.width > canvas.width - 100
  ) {

    enemy.vx *= -1;

  }


  // 敵との衝突
  if (collision(player, enemy)) {

    hp--;

    player.x = 80;
    player.y = 100;

    enemy.x = stage === 1 ? 500 : 450;


    if (hp <= 0) {

      gameOver = true;

    }

  }


  // コイン
  for (const coin of coins) {

    if (!coin.taken) {

      const coinBox = {

        x: coin.x,
        y: coin.y,
        width: coin.size,
        height: coin.size

      };


      if (collision(player, coinBox)) {

        coin.taken = true;

        coinCount++;

      }

    }

  }


  // ゴール
  if (collision(player, goal)) {

    clearStage();

  }

}


// 描画
function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // ステージによって背景を変更
  if (stage === 1) {

    ctx.fillStyle = "#74c0fc";

  } else {

    ctx.fillStyle = "#b197fc";

  }

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // 地面
  ctx.fillStyle = "#40c057";

  ctx.fillRect(
    ground.x,
    ground.y,
    ground.width,
    ground.height
  );


  // コイン
  for (const coin of coins) {

    if (!coin.taken) {

      ctx.beginPath();

      ctx.arc(
        coin.x + coin.size / 2,
        coin.y + coin.size / 2,
        coin.size / 2,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#ffd43b";

      ctx.fill();

      ctx.strokeStyle = "#f08c00";

      ctx.lineWidth = 3;

      ctx.stroke();

    }

  }


  // ゴール
  ctx.fillStyle = "#7950f2";

  ctx.fillRect(
    goal.x,
    goal.y,
    8,
    goal.height
  );


  ctx.fillStyle = "#ff6b6b";

  ctx.beginPath();

  ctx.moveTo(
    goal.x + 8,
    goal.y
  );

  ctx.lineTo(
    goal.x + 35,
    goal.y + 18
  );

  ctx.lineTo(
    goal.x + 8,
    goal.y + 36
  );

  ctx.closePath();

  ctx.fill();


  // プレイヤー
  ctx.fillStyle = "#ff6b6b";

  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );


  // 敵
  ctx.fillStyle =
    stage === 1 ? "#7048e8" : "#c92a2a";

  ctx.fillRect(
    enemy.x,
    enemy.y,
    enemy.width,
    enemy.height
  );


  // 敵の目
  ctx.fillStyle = "white";

  ctx.fillRect(
    enemy.x + 8,
    enemy.y + 10,
    8,
    8
  );

  ctx.fillRect(
    enemy.x + 29,
    enemy.y + 10,
    8,
    8
  );


  // 情報
  document.getElementById("info").textContent =
    "STAGE " + stage +
    "　❤️ HP: " + hp +
    "　🪙 COIN: " + coinCount + "/" + coins.length;


  // ステージクリア表示
  if (stageClear) {

    ctx.fillStyle = "rgba(0,0,0,0.65)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#ffd43b";

    ctx.textAlign = "center";

    ctx.font = "45px sans-serif";

    ctx.fillText(
      "STAGE " + stage + " CLEAR!",
      canvas.width / 2,
      canvas.height / 2
    );

    ctx.textAlign = "left";

  }


  // ゲームオーバー
  if (gameOver) {

    ctx.fillStyle = "rgba(0,0,0,0.7)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "white";

    ctx.textAlign = "center";

    ctx.font = "45px sans-serif";

    ctx.fillText(
      "GAME OVER",
      canvas.width / 2,
      canvas.height / 2
    );

    ctx.font = "20px sans-serif";

    ctx.fillText(
      "ページを再読み込みしてください",
      canvas.width / 2,
      canvas.height / 2 + 45
    );

    ctx.textAlign = "left";

  }


  // 最終クリア
  if (finalClear) {

    ctx.fillStyle = "rgba(0,0,0,0.75)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#ffd43b";

    ctx.textAlign = "center";

    ctx.font = "50px sans-serif";

    ctx.fillText(
      "🎉 ALL CLEAR!",
      canvas.width / 2,
      canvas.height / 2
    );

    ctx.fillStyle = "white";

    ctx.font = "24px sans-serif";

    ctx.fillText(
      "STAGE 1 & 2 COMPLETE!",
      canvas.width / 2,
      canvas.height / 2 + 50
    );

    ctx.textAlign = "left";

  }

}


// ゲーム開始
loadStage();


// ゲームループ
function gameLoop() {

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
