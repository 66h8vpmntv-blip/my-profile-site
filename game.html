<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>2D Action Game</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  background: #111;
  overflow: hidden;
  font-family: sans-serif;
}

#game {
  display: block;
  width: 100vw;
  height: 70vh;
  background: linear-gradient(#74c0fc, #d0ebff);
}

#info {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-size: 20px;
  font-weight: bold;
  z-index: 10;
}

#controls {
  height: 30vh;
  background: #222;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

button {
  width: 100px;
  height: 100px;
  border: none;
  border-radius: 50%;
  background: #555;
  color: white;
  font-size: 40px;
}

#jump {
  background: #e03131;
}
</style>
</head>

<body>

<div id="info">❤️ HP: 3　🪙 COIN: 0</div>

<canvas id="game"></canvas>

<div id="controls">
  <button id="left">←</button>
  <button id="jump">↑</button>
  <button id="right">→</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = {
  x: 80,
  y: 100,
  width: 40,
  height: 40,
  vx: 0,
  vy: 0,
  speed: 5,
  jumpPower: 12,
  grounded: false
};

const enemy = {
  x: 500,
  y: 100,
  width: 45,
  height: 45,
  vx: 2.5
};

const ground = {
  x: 0,
  y: 0,
  width: 0,
  height: 50
};

const coins = [
  { x: 250, y: 250, size: 22, taken: false },
  { x: 380, y: 180, size: 22, taken: false },
  { x: 520, y: 250, size: 22, taken: false },
  { x: 680, y: 150, size: 22, taken: false },
  { x: 820, y: 250, size: 22, taken: false }
];

const goal = {
  x: 0,
  y: 0,
  width: 35,
  height: 80
};

let hp = 3;
let coinCount = 0;
let gameClear = false;
let gameOver = false;

const gravity = 0.6;

const keys = {
  left: false,
  right: false
};


// 画面サイズ
function resize() {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.7;

  ground.y = canvas.height - 50;
  ground.width = canvas.width;

  goal.x = canvas.width - 70;
  goal.y = ground.y - goal.height;
}

resize();

window.addEventListener("resize", resize);


// 当たり判定
function collision(a, b) {

  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );

}


// ジャンプ
function jump() {

  if (player.grounded && !gameOver && !gameClear) {

    player.vy = -player.jumpPower;

    player.grounded = false;
  }
}


// ボタン設定
function setupButton(id, key) {

  const button = document.getElementById(id);

  button.addEventListener("touchstart", e => {
    e.preventDefault();
    keys[key] = true;
  });

  button.addEventListener("touchend", e => {
    e.preventDefault();
    keys[key] = false;
  });

  button.addEventListener("mousedown", e => {
    e.preventDefault();
    keys[key] = true;
  });

  button.addEventListener("mouseup", e => {
    e.preventDefault();
    keys[key] = false;
  });
}

setupButton("left", "left");
setupButton("right", "right");


document.getElementById("jump").addEventListener("touchstart", e => {
  e.preventDefault();
  jump();
});

document.getElementById("jump").addEventListener("mousedown", e => {
  e.preventDefault();
  jump();
});


// キーボード操作
window.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft") {
    keys.left = true;
  }

  if (e.key === "ArrowRight") {
    keys.right = true;
  }

  if (e.key === "ArrowUp" || e.key === " ") {
    jump();
  }

});


window.addEventListener("keyup", e => {

  if (e.key === "ArrowLeft") {
    keys.left = false;
  }

  if (e.key === "ArrowRight") {
    keys.right = false;
  }

});


// ゲーム更新
function update() {

  if (gameOver || gameClear) {
    return;
  }


  // プレイヤー移動
  if (keys.left) {
    player.vx = -player.speed;
  }
  else if (keys.right) {
    player.vx = player.speed;
  }
  else {
    player.vx = 0;
  }

  player.x += player.vx;


  // 重力
  player.vy += gravity;
  player.y += player.vy;


  // 地面
  if (player.y + player.height >= ground.y) {

    player.y = ground.y - player.height;

    player.vy = 0;

    player.grounded = true;
  }


  // 画面端
  if (player.x < 0) {
    player.x = 0;
  }

  if (player.x + player.width > canvas.width) {
    player.x = canvas.width - player.width;
  }


  // 敵
  enemy.x += enemy.vx;

  if (
    enemy.x < 100 ||
    enemy.x + enemy.width > canvas.width - 100
  ) {
    enemy.vx *= -1;
  }


  // 敵との衝突
  if (collision(player, enemy)) {

    hp--;

    player.x = 80;
    player.y = 100;

    enemy.x = 500;

    if (hp <= 0) {
      gameOver = true;
    }
  }


  // コイン
  for (const coin of coins) {

    if (!coin.taken) {

      const coinBox = {
        x: coin.x,
        y: coin.y,
        width: coin.size,
        height: coin.size
      };

      if (collision(player, coinBox)) {

        coin.taken = true;

        coinCount++;
      }
    }
  }


  // ゴール
  if (collision(player, goal)) {

    gameClear = true;
  }

}


// 描画
function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // 地面
  ctx.fillStyle = "#40c057";

  ctx.fillRect(
    ground.x,
    ground.y,
    ground.width,
    ground.height
  );


  // コイン
  for (const coin of coins) {

    if (!coin.taken) {

      ctx.beginPath();

      ctx.arc(
        coin.x + coin.size / 2,
        coin.y + coin.size / 2,
        coin.size / 2,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#ffd43b";

      ctx.fill();

      ctx.strokeStyle = "#f08c00";

      ctx.lineWidth = 3;

      ctx.stroke();
    }
  }


  // ゴールの旗
  ctx.fillStyle = "#7950f2";

  ctx.fillRect(
    goal.x,
    goal.y,
    8,
    goal.height
  );

  ctx.fillStyle = "#ff6b6b";

  ctx.beginPath();

  ctx.moveTo(
    goal.x + 8,
    goal.y
  );

  ctx.lineTo(
    goal.x + 35,
    goal.y + 18
  );

  ctx.lineTo(
    goal.x + 8,
    goal.y + 36
  );

  ctx.closePath();

  ctx.fill();


  // プレイヤー
  ctx.fillStyle = "#ff6b6b";

  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );


  // 敵
  ctx.fillStyle = "#7048e8";

  ctx.fillRect(
    enemy.x,
    enemy.y,
    enemy.width,
    enemy.height
  );


  // 敵の目
  ctx.fillStyle = "white";

  ctx.fillRect(
    enemy.x + 8,
    enemy.y + 10,
    8,
    8
  );

  ctx.fillRect(
    enemy.x + 29,
    enemy.y + 10,
    8,
    8
  );


  // 情報
  document.getElementById("info").textContent =
    "❤️ HP: " + hp +
    "　🪙 COIN: " + coinCount + "/5";


  // GAME OVER
  if (gameOver) {

    ctx.fillStyle = "rgba(0,0,0,0.7)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "white";

    ctx.textAlign = "center";

    ctx.font = "40px sans-serif";

    ctx.fillText(
      "GAME OVER",
      canvas.width / 2,
      canvas.height / 2
    );

    ctx.font = "20px sans-serif";

    ctx.fillText(
      "ページを再読み込みしてください",
      canvas.width / 2,
      canvas.height / 2 + 45
    );

    ctx.textAlign = "left";
  }


  // CLEAR
  if (gameClear) {

    ctx.fillStyle = "rgba(0,0,0,0.7)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#ffd43b";

    ctx.textAlign = "center";

    ctx.font = "50px sans-serif";

    ctx.fillText(
      "🎉 CLEAR!",
      canvas.width / 2,
      canvas.height / 2
    );

    ctx.fillStyle = "white";

    ctx.font = "24px sans-serif";

    ctx.fillText(
      "コイン: " + coinCount + "/5",
      canvas.width / 2,
      canvas.height / 2 + 50
    );

    ctx.textAlign = "left";
  }

}


// ゲームループ
function gameLoop() {

  update();

  draw();

  requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
