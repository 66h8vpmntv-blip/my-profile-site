<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MY PROFILE</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     上部メニュー
========================= -->

<header>

  <a href="profile.html">
    PROFILE
  </a>

  <a href="favorite.html">
    FAVORITE
  </a>

  <a href="game.html">
    🎮 GAME
  </a>

</header>


<!-- =========================
     HOME
========================= -->

<main>

  <!-- Google風タイトル -->

  <div class="logo">

    <span class="blue">M</span>
    <span class="red">Y</span>

    <span class="yellow"> </span>

    <span class="blue">P</span>
    <span class="green">R</span>
    <span class="red">O</span>
    <span class="yellow">F</span>
    <span class="blue">I</span>
    <span class="green">L</span>
    <span class="red">E</span>

  </div>


  <!-- =========================
       検索
  ========================= -->

  <div class="search-area">

    <div class="search-box">

      <span class="search-icon">
        🔍
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="Search"
        autocomplete="off"
      >

    </div>


    <div class="buttons">

      <button onclick="googleSearch()">
        Google Search
      </button>

      <a href="game.html">
        🎮 GAME
      </a>

    </div>

  </div>

</main>


<!-- =========================
     フッター
========================= -->

<footer>

  <a href="index.html">
    HOME
  </a>

  <a href="profile.html">
    PROFILE
  </a>

  <a href="favorite.html">
    FAVORITE
  </a>

  <a href="game.html">
    🎮 GAME
  </a>

</footer>


<!-- =========================
     検索機能
========================= -->

<script>

function googleSearch() {

  const text =
    document
      .getElementById("searchInput")
      .value
      .trim();


  // 空欄なら何もしない

  if (text === "") {
    return;
  }


  // 大文字・小文字を区別しない

  const search =
    text.toLowerCase();


  /* =========================
     サイト内検索
  ========================= */


  // PROFILE

  if (
    search === "profile" ||
    search === "プロフィール"
  ) {

    window.location.href =
      "profile.html";

    return;
  }


  // FAVORITE

  if (
    search === "favorite" ||
    search === "お気に入り" ||
    search === "お気に入りページ"
  ) {

    window.location.href =
      "favorite.html";

    return;
  }


  // GAME

  if (
    search === "game" ||
    search === "ゲーム"
  ) {

    window.location.href =
      "game.html";

    return;
  }


  // HOME

  if (
    search === "home" ||
    search === "ホーム"
  ) {

    window.location.href =
      "index.html";

    return;
  }


  /* =========================
     その他はGoogle検索
  ========================= */

  window.location.href =
    "https://www.google.com/search?q="
    +
    encodeURIComponent(text);

}


/* =========================
   Enterキーでも検索
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        googleSearch();

      }

    }
  );

</script>


</body>

</html>
