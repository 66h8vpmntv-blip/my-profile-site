<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MY PROFILE</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family: Arial, "Helvetica Neue", sans-serif;

  background: white;
  color: #202124;
}


/* =========================
   上部メニュー
========================= */

header {
  height: 70px;

  display: flex;
  justify-content: flex-end;
  align-items: center;

  padding: 0 25px;
  gap: 20px;
}

header a {
  color: #202124;
  text-decoration: none;
  font-size: 14px;
}

header a:hover {
  text-decoration: underline;
}


/* =========================
   HOME
========================= */

main {
  min-height: calc(100vh - 130px);

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding-bottom: 100px;
}


/* =========================
   Google風タイトル
========================= */

.logo {
  font-size: 64px;

  font-weight: 600;

  letter-spacing: -4px;

  margin-bottom: 30px;

  font-family: Arial, sans-serif;
}

.logo .blue {
  color: #4285F4;
}

.logo .red {
  color: #EA4335;
}

.logo .yellow {
  color: #FBBC05;
}

.logo .green {
  color: #34A853;
}


/* =========================
   検索エリア
========================= */

.search-area {
  width: min(90vw, 580px);
}


/* =========================
   検索ボックス
========================= */

.search-box {
  width: 100%;

  height: 48px;

  border: 1px solid #dfe1e5;

  border-radius: 24px;

  display: flex;
  align-items: center;

  padding: 0 18px;

  background: white;

  box-shadow:
    0 1px 6px rgba(32,33,36,0.15);
}

.search-box:hover {
  box-shadow:
    0 1px 8px rgba(32,33,36,0.25);
}


/* =========================
   検索アイコン
========================= */

.search-icon {
  font-size: 18px;

  color: #777;

  margin-right: 10px;
}


/* =========================
   入力欄
========================= */

#searchInput {
  flex: 1;

  border: none;

  outline: none;

  font-size: 16px;

  color: #202124;

  background: transparent;
}

#searchInput::placeholder {
  color: #777;
}


/* =========================
   ボタン
========================= */

.buttons {
  display: flex;

  justify-content: center;

  gap: 12px;

  margin-top: 28px;
}

.buttons a,
.buttons button {
  border: 1px solid #f8f9fa;

  background: #f8f9fa;

  color: #202124;

  padding: 10px 18px;

  border-radius: 4px;

  font-size: 14px;

  text-decoration: none;

  cursor: pointer;
}

.buttons a:hover,
.buttons button:hover {
  border: 1px solid #dadce0;

  box-shadow:
    0 1px 1px rgba(0,0,0,0.1);
}


/* =========================
   フッター
========================= */

footer {
  height: 60px;

  background: #f2f2f2;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 25px;

  border-top: 1px solid #dadce0;
}

footer a {
  color: #5f6368;

  text-decoration: none;

  font-size: 14px;
}

footer a:hover {
  text-decoration: underline;
}


/* =========================
   スマホ・iPad
========================= */

@media (max-width: 600px) {

  .logo {
    font-size: 48px;
    letter-spacing: -3px;
  }

  header {
    padding-right: 15px;
    gap: 12px;
  }

  header a {
    font-size: 13px;
  }

  .search-box {
    height: 46px;
  }

  footer {
    gap: 15px;
  }

}

</style>

</head>


<body>


<!-- =========================
     上部メニュー
========================= -->

<header>

  <a href="profile.html">
    PROFILE
  </a>

  <a href="favorite.html">
    FAVORITE
  </a>

  <a href="game.html">
    🎮 GAME
  </a>

</header>


<!-- =========================
     HOME
========================= -->

<main>

  <!-- Google風タイトル -->

  <div class="logo">

    <span class="blue">M</span>
    <span class="red">Y</span>

    <span class="yellow"> </span>

    <span class="blue">P</span>
    <span class="green">R</span>
    <span class="red">O</span>
    <span class="yellow">F</span>
    <span class="blue">I</span>
    <span class="green">L</span>
    <span class="red">E</span>

  </div>


  <!-- =========================
       検索
  ========================= -->

  <div class="search-area">

    <div class="search-box">

      <span class="search-icon">
        🔍
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="Search"
        autocomplete="off"
      >

    </div>


    <div class="buttons">

      <button onclick="googleSearch()">
        Google Search
      </button>

      <a href="game.html">
        🎮 GAME
      </a>

    </div>

  </div>

</main>


<!-- =========================
     フッター
========================= -->

<footer>

  <a href="index.html">
    HOME
  </a>

  <a href="profile.html">
    PROFILE
  </a>

  <a href="favorite.html">
    FAVORITE
  </a>

  <a href="game.html">
    🎮 GAME
  </a>

</footer>


<!-- =========================
     検索機能
========================= -->

<script>

function googleSearch() {

  const text =
    document
      .getElementById("searchInput")
      .value
      .trim();


  // 空欄なら何もしない

  if (text === "") {
    return;
  }


  // 大文字・小文字を区別しない

  const search =
    text.toLowerCase();


  /* =========================
     サイト内検索
  ========================= */


  // PROFILE

  if (
    search === "profile" ||
    search === "プロフィール"
  ) {

    window.location.href =
      "profile.html";

    return;
  }


  // FAVORITE

  if (
    search === "favorite" ||
    search === "お気に入り" ||
    search === "お気に入りページ"
  ) {

    window.location.href =
      "favorite.html";

    return;
  }


  // GAME

  if (
    search === "game" ||
    search === "ゲーム"
  ) {

    window.location.href =
      "game.html";

    return;
  }


  // HOME

  if (
    search === "home" ||
    search === "ホーム"
  ) {

    window.location.href =
      "index.html";

    return;
  }


  /* =========================
     その他はGoogle検索
  ========================= */

  window.location.href =
    "https://www.google.com/search?q="
    +
    encodeURIComponent(text);

}


/* =========================
   Enterキーでも検索
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        googleSearch();

      }

    }
  );

</script>


</body>

</html>
