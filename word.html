<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>英単語トレーニング</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="study-tabs">

  <a href="word.html" class="study-tab active">
    📖 WORD
  </a>

  <a href="study.html" class="study-tab">
    📊 STUDY
  </a>

    <!-- ==============================
     レベル選択
     ============================== -->

<section class="level-section">

  <h2>📚 学習レベル</h2>

  <div class="level-buttons">

    <button
      onclick="selectLevel('junior')"
    >
      🌱 中学
    </button>

    <button
      onclick="selectLevel('high')"
    >
      📖 高校
    </button>

    <button
      onclick="selectLevel('toeic400')"
    >
      🎯 TOEIC 400
    </button>

    <button
      onclick="selectLevel('toeic500')"
    >
      🚀 TOEIC 500
    </button>

    <button
      onclick="selectLevel('toeic600')"
    >
      🔥 TOEIC 600
    </button>

    <button
      onclick="selectLevel('toeic700')"
    >
      💪 TOEIC 700
    </button>

  </div>

</section>
</nav>
  <header>
    <h1>📚 英単語トレーニング</h1>
  </header>

  <main class="word-container">

    <div class="word-info">
      <span id="level">Lv.1 中学基礎</span>
      <span id="progress">1 / 10</span>
    </div>

    <div class="word-card">

      <p class="question-label">この単語の意味は？</p>

      <h2 id="word">apple</h2>

      <div id="choices">

        <button onclick="answer(0)">りんご</button>

        <button onclick="answer(1)">学校</button>

        <button onclick="answer(2)">先生</button>

        <button onclick="answer(3)">本</button>

      </div>

      <p id="result"></p>

      <button id="nextButton" onclick="nextQuestion()" style="display:none;">
        次の問題 →
      </button>

    </div>

    <div class="score">
      <p>正解：<span id="correct">0</span></p>
      <p>問題数：<span id="total">0</span></p>
    </div>

    <div class="word-navigation">

  <a href="study.html" class="page-button">
    📊 学習記録
  </a>

  <a href="index.html" class="page-button">
    🏠 HOME
  </a>

</div>
    
  </main>

  <script src="script.js"></script>

</body>
</html>
